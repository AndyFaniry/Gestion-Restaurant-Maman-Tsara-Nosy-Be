<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>

  <!-- ── SIDEBAR FRAGMENT ── -->
  <aside th:fragment="sidebar(activeMenu)" class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="brand-name">Maman Tsara</div>
        <div class="brand-sub">Nosy Be</div>
      </div>
    </div>

    <div class="sidebar-section">Menu Principal</div>

    <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      Tableau de bord
    </a>

    <div class="sidebar-section">Gestion Restaurant</div>

    <a th:href="@{/commandes}" class="nav-item" th:classappend="${activeMenu == 'commandes'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Commandes
    </a>

    <a th:href="@{/plats}" class="nav-item" th:classappend="${activeMenu == 'plats'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Plats & Menus
    </a>

    <a th:href="@{/ingredients}" class="nav-item" th:classappend="${activeMenu == 'ingredients'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
      Ingrédients
    </a>

    <a th:href="@{/stocks}" class="nav-item" th:classappend="${activeMenu == 'stocks'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Stocks
    </a>

    <a th:href="@{/caisse}" class="nav-item" th:classappend="${activeMenu == 'caisse'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Caisse
    </a>

    <div class="sidebar-section">Acteurs</div>

    <a th:href="@{/clients}" class="nav-item" th:classappend="${activeMenu == 'clients'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Clients
    </a>

    <a th:href="@{/fournisseurs}" class="nav-item" th:classappend="${activeMenu == 'fournisseurs'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      Fournisseurs
    </a>

    <a th:href="@{/personnels}" class="nav-item" th:classappend="${activeMenu == 'personnels'} ? 'active'">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Personnel
    </a>
  </aside>

  <!-- ── TOPBAR / NAVBAR FRAGMENT ── -->
  <div th:fragment="topbar(pageTitle)" class="topbar">
    <div class="topbar-title" th:text="${pageTitle}">Titre de la page</div>
    <div class="topbar-search">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Rechercher…" />
    </div>
    <div class="topbar-actions">
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </button>
    </div>
  </div>

</body>
</html>
