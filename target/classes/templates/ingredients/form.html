<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Ingrédient - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>

<div class="app">

    <!-- Sidebar globale avec l'onglet 'ingredients' actif -->
    <aside th:replace="~{fragments/layout :: sidebar('ingredients')}"></aside>

    <div class="main">
        <!-- Topbar globale avec titre dynamique -->
        <div th:replace="~{fragments/layout :: topbar(${ingredient.id == null ? 'Ajouter un Ingrédient' : 'Modifier l\'Ingrédient'})}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h2 th:text="${ingredient.id == null ? 'Ajouter un Ingrédient' : 'Modifier l\'Ingrédient'}">Ingrédient</h2>
                    <div class="breadcrumb">Accueil / Ingrédients / <span th:text="${ingredient.id == null ? 'Nouveau' : 'Édition'}">Formulaire</span></div>
                </div>
                <a th:href="@{/ingredients}" class="btn btn-secondary btn-sm">Retour à la liste</a>
            </div>

            <div class="card">
                <section class="form-container">
                    <form th:action="@{/ingredients/save}" th:object="${ingredient}" method="post" class="custom-form">
                        <input type="hidden" th:field="*{id}" />

                        <!-- Nom de l'ingrédient -->
                        <div class="form-group">
                            <label for="nom">Nom de l'ingrédient :</label>
                            <input type="text" id="nom" th:field="*{nom}" placeholder="Ex: Riz, Huile..." required class="form-control" />
                        </div>

                        <!-- Catégorie -->
                        <div class="form-group">
                            <label for="categorieIngredients">Catégorie :</label>
                            <select id="categorieIngredients" th:field="*{categorieIngredients.id}" class="form-control" required>
                                <option value="">-- Sélectionner une catégorie --</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.libelle}">Catégorie</option>
                            </select>
                        </div>

                        <!-- Statut -->
                        <div class="form-group">
                            <label for="statutIngredient">Statut :</label>
                            <select id="statutIngredient" th:field="*{statutIngredient.id}" class="form-control" required>
                                <option value="">-- Sélectionner un statut --</option>
                                <option th:each="st : ${statuts}" 
                                        th:value="${st.id}" 
                                        th:text="${st.libelle}">Statut</option>
                            </select>
                        </div>

                        <!-- Fournisseur -->
                        <div class="form-group">
                            <label for="fournisseur">Fournisseur :</label>
                            <select id="fournisseur" th:field="*{fournisseur.id}" class="form-control" required>
                                <option value="">-- Sélectionner un fournisseur --</option>
                                <option th:each="f : ${fournisseurs}" 
                                        th:value="${f.id}" 
                                        th:text="${f.nom + ' ' + (f.prenom != null ? f.prenom : '')}">Fournisseur</option>
                            </select>
                        </div>

                        <div class="form-actions" style="margin-top: 20px;">
                            <button type="submit" class="btn btn-primary">Enregistrer</button>
                            <a th:href="@{/ingredients}" class="btn btn-secondary">Annuler</a>
                        </div>
                        <div class="mb-3">
                            <label for="unite" class="form-label">Unité de mesure</label>
                            <select class="form-select" id="unite" th:field="*{unite}">
                                <option value="">-- Choisir une unité --</option>
                                <option th:each="u : ${unites}" 
                                        th:value="${u.id}" 
                                        th:text="${u.nom + ' (' + u.symbole + ')'}">
                                </option>
                            </select>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/Design-template/Design/script.js}"></script>
</body>
</html>
