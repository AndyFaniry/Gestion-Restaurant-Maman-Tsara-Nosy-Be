<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Personnel</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1 th:text="${personnel.id == null ? 'Ajouter un Employé' : 'Modifier l''Employé'}"></h1>
            </header>
            <section class="form-container">
                <form th:action="@{/personnels/save}" th:object="${personnel}" method="post" class="custom-form">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group">
                        <label>Nom :</label>
                        <input type="text" th:field="*{nom}" required class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Prénom :</label>
                        <input type="text" th:field="*{prenom}" required class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Contact :</label>
                        <input type="text" th:field="*{contact}" required class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Rôle :</label>
                        <select th:field="*{rolePersonnels}" class="form-control" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.libelle}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date d'embauche :</label>
                        <input type="date" th:field="*{dateEmbauche}" required class="form-control" />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                        <a th:href="@{/personnels}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
