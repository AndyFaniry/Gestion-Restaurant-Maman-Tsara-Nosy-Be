<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${'Gestion employe'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

  <!-- Sidebar globale avec l'onglet 'personnels' actif -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='personnels')}"></aside>

  <!-- Conteneur principal -->
  <div class="main">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <!-- En-tête de la page -->
      <div class="page-header">
        <div>
          <h2 th:text="${personnel.id == null ? 'Ajouter un Employé' : 'Modifier l Employé'}">
            Formulaire Personnel
          </h2>
          <div class="breadcrumb">
            Accueil / <a th:href="@{/personnels}">Personnel</a> / 
            <span th:text="${personnel.id == null ? 'Nouveau' : 'Édition'}">Formulaire</span>
          </div>
        </div>
        <a th:href="@{/personnels}" class="btn btn-secondary">&larr; Annuler</a>
      </div>

      <!-- Formulaire de saisie -->
      <form th:action="@{/personnels/save}" th:object="${personnel}" method="post" id="personnelForm">
        <input type="hidden" th:field="*{id}" />

        <div class="form-card mb-4">
          <h3 class="text-primary mb-3">Informations de l'Employé</h3>

          <div class="form-grid">
            
            <div class="field-group">
              <label for="nom" class="field-label">Nom <span class="required">*</span></label>
              <input type="text" id="nom" th:field="*{nom}" required class="form-control" placeholder="Entrez le nom" />
            </div>

            <div class="field-group">
              <label for="prenom" class="field-label">Prénom</label>
              <input type="text" id="prenom" th:field="*{prenom}" class="form-control" placeholder="Entrez le prénom" />
            </div>

            <div class="field-group">
              <label for="contact" class="field-label">Contact <span class="required">*</span></label>
              <input type="text" id="contact" th:field="*{contact}" required class="form-control" placeholder="Numéro de téléphone" />
            </div>

            <div class="field-group">
              <label for="idRole" class="field-label">Rôle / Poste <span class="required">*</span></label>
              <select id="idRole" th:field="*{idRole}" required class="form-control">
                <option value="">-- Sélectionner un rôle --</option>
                <option th:each="r : ${roles}" 
                        th:value="${r.id}" 
                        th:text="${r.libelle}">
                  Rôle
                </option>
              </select>
            </div>

            <div class="field-group">
              <label for="dateEmbauche" class="field-label">Date d'embauche <span class="required">*</span></label>
              <input type="date" id="dateEmbauche" th:field="*{dateEmbauche}" required class="form-control" />
            </div>

          </div>
        </div>

        <!-- Barre d'actions -->
        <div class="toolbar d-flex justify-content-end gap-2 mb-4">
          <a th:href="@{/personnels}" class="btn btn-secondary">Annuler</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Enregistrer
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
