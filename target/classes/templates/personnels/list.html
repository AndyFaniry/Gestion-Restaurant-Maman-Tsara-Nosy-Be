<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnels - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>

<div class="app">

    <!-- Sidebar globale avec l'onglet 'personnels' actif -->
    <aside th:replace="~{fragments/layout :: sidebar('personnels')}"></aside>

    <div class="main">
        <!-- Topbar globale -->
        <div th:replace="~{fragments/layout :: topbar('Gestion du Personnel')}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h2>Gestion du Personnel</h2>
                    <div class="breadcrumb">Accueil / <span>Personnel</span></div>
                </div>
                <a th:href="@{/personnels/new}" class="btn btn-primary btn-sm">+ Nouvel Employé</a>
            </div>

            <div class="card">
                <section class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Contact</th>
                                <th>Rôle</th>
                                <th>Embauche</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${personnelsList}">
                                <td th:text="${p.id}">1</td>
                                <td th:text="${p.nom}">Nom</td>
                                <td th:text="${p.prenom}">Prénom</td>
                                <td th:text="${p.contact}">0320000000</td>
                                <td th:text="${p.rolePersonnels != null ? p.rolePersonnels.libelle : 'N/A'}">Rôle</td>
                                <td th:text="${#temporals.format(p.dateEmbauche, 'dd/MM/yyyy')}">01/01/2024</td>
                                <td class="actions">
                                    <a th:href="@{/personnels/edit/{id}(id=${p.id})}" class="btn btn-sm btn-secondary">Modifier</a>
                                    <a th:href="@{/personnels/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Supprimer cet employé ?');">Supprimer</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(personnelsList)}">
                                <td colspan="7" style="text-align: center; color: #888;">Aucun membre du personnel enregistré.</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/Design-template/Design/script.js}"></script>
</body>
</html>
