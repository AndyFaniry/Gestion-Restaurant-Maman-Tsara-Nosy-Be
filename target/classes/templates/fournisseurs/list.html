<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fournisseurs - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>

<div class="app">

    <!-- Sidebar globale avec l'onglet 'fournisseurs' actif -->
    <aside th:replace="~{fragments/layout :: sidebar('fournisseurs')}"></aside>

    <div class="main">
        <!-- Topbar globale -->
        <div th:replace="~{fragments/layout :: topbar('Gestion des Fournisseurs')}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h2>Gestion des Fournisseurs</h2>
                    <div class="breadcrumb">Accueil / <span>Fournisseurs</span></div>
                </div>
                <a th:href="@{/fournisseurs/new}" class="btn btn-primary btn-sm">+ Nouveau Fournisseur</a>
            </div>

            <div class="card">
                <section class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Contact</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${fournisseursList}">
                                <td th:text="${f.id}">1</td>
                                <td th:text="${f.nom}">Nom</td>
                                <td th:text="${f.prenom}">Prénom</td>
                                <td th:text="${f.contact}">0340000000</td>
                                <td th:text="${f.typeFournisseurs != null ? f.typeFournisseurs.libelle : 'N/A'}">Type</td>
                                <td class="actions">
                                    <a th:href="@{/fournisseurs/edit/{id}(id=${f.id})}" class="btn btn-sm btn-secondary">Modifier</a>
                                    <a th:href="@{/fournisseurs/delete/{id}(id=${f.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmer la suppression ?');">Supprimer</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(fournisseursList)}">
                                <td colspan="6" style="text-align: center; color: #888;">Aucun fournisseur enregistré pour le moment.</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/Design-template/Design/script.js}"></script>
</body>
</html>
