<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Commande</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1 th:text="${commande.id == null ? 'Créer une Commande' : 'Modifier la Commande'}"></h1>
            </header>
            <section class="form-container">
                <form th:action="@{/commandes/save}" th:object="${commande}" method="post" class="custom-form">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group">
                        <label>Client :</label>
                        <select th:field="*{client}" class="form-control" required>
                            <option value="">-- Sélectionner un client --</option>
                            <option th:each="cli : ${clients}" th:value="${cli.id}" th:text="${cli.nom + ' ' + cli.prenom}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date Commande :</label>
                        <input type="date" th:field="*{dateCommande}" required class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Zone de Livraison :</label>
                        <select th:field="*{zoneLivraison}" class="form-control">
                            <option value="">-- Aucune (Sur place) --</option>
                            <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.libelle + ' (' + z.prix + ' Ar)'}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Montant Total (Ar) :</label>
                        <input type="number" step="0.01" th:field="*{montantTotal}" required class="form-control" />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                        <a th:href="@{/commandes}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
