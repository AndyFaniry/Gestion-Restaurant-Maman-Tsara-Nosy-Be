<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commandes - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1>Suivi des Commandes</h1>
                <a th:href="@{/commandes/new}" class="btn btn-primary">Nouvelle Commande</a>
            </header>
            <section class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Client</th><th>Date</th><th>Zone Livraison</th><th>Montant Total (Ar)</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${commandesList}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.client != null ? (c.client.nom + ' ' + c.client.prenom) : 'N/A'}">Client</td>
                            <td th:text="${c.dateCommande}">2026-07-30</td>
                            <td th:text="${c.zoneLivraison != null ? c.zoneLivraison.libelle : 'Sur place'}">Zone</td>
                            <td th:text="${#numbers.formatDecimal(c.montantTotal, 1, 'POINT', 2, 'COMMA')}">45000.00</td>
                            <td class="actions">
                                <a th:href="@{/commandes/edit/{id}(id=${c.id})}" class="btn btn-warning">Modifier</a>
                                <a th:href="@{/commandes/delete/{id}(id=${c.id})}" class="btn btn-danger" onclick="return confirm('Annuler cette commande ?');">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
