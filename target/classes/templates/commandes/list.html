<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commandes - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>

<div class="app">

    <!-- Sidebar globale avec l'onglet 'commandes' actif -->
    <aside th:replace="~{fragments/layout :: sidebar('commandes')}"></aside>

    <div class="main">
        <!-- Topbar globale -->
        <div th:replace="~{fragments/layout :: topbar('Suivi des Commandes')}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h2>Suivi des Commandes</h2>
                    <div class="breadcrumb">Accueil / <span>Commandes</span></div>
                </div>
                <a th:href="@{/commandes/new}" class="btn btn-primary btn-sm">+ Nouvelle Commande</a>
            </div>

            <div class="card">
                <section class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Client</th>
                                <th>Date</th>
                                <th>Zone Livraison</th>
                                <th>Montant Total (Ar)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${commandesList}">
                                <td th:text="${c.id}">1</td>
                                <td th:text="${c.client != null ? (c.client.nom + ' ' + c.client.prenom) : 'N/A'}">Nom Prénom</td>
                                <td th:text="${#temporals.format(c.dateCommande, 'dd/MM/yyyy HH:mm')}">30/07/2026 12:00</td>
                                <td th:text="${c.zoneLivraison != null ? c.zoneLivraison.libelle : 'Sur place'}">Zone</td>
                                <td th:text="${#numbers.formatDecimal(c.montantTotal, 1, 'WHITESPACE', 2, 'POINT')} + ' Ar'">45 000.00 Ar</td>
                                <td class="actions">
                                    <a th:href="@{/commandes/edit/{id}(id=${c.id})}" class="btn btn-sm btn-secondary">Modifier</a>
                                    <a th:href="@{/commandes/delete/{id}(id=${c.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Annuler cette commande ?');">Supprimer</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(commandesList)}">
                                <td colspan="6" style="text-align: center; color: #888;">Aucune commande enregistrée pour le moment.</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/Design-template/Design/script.js}"></script>
</body>
</html>
