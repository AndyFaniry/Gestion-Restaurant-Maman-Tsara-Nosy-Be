<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Plats - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1>Carte des Plats</h1>
                <a th:href="@{/plats/new}" class="btn btn-primary">Nouveau Plat</a>
            </header>
            <section class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Nom</th><th>Catégorie</th><th>Prix de vente (Ar)</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${platsList}">
                            <td th:text="${p.id}">1</td>
                            <td th:text="${p.nom}">Plat</td>
                            <td th:text="${p.categoriePlats != null ? p.categoriePlats.libelle : 'N/A'}">Catégorie</td>
                            <td th:text="${#numbers.formatDecimal(p.prixVente, 1, 'POINT', 2, 'COMMA')}">35000.00</td>
                            <td class="actions">
                                <a th:href="@{/plats/edit/{id}(id=${p.id})}" class="btn btn-warning">Modifier</a>
                                <a th:href="@{/plats/delete/{id}(id=${p.id})}" class="btn btn-danger" onclick="return confirm('Supprimer ce plat ?');">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
