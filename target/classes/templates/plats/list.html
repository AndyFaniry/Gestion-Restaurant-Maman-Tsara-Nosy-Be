<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Plats</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-egg-fried"></i> Liste des Plats</h2>
        <a th:href="@{/plats/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Créer des Plats / Recettes</a>
    </div>

    <!-- Formulaire de filtre -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/plats}" method="get" th:object="${criteria}" class="row g-3">
                <div class="col-md-5">
                    <input type="text" th:field="*{nom}" class="form-control" placeholder="Rechercher par nom de plat...">
                </div>
                <div class="col-md-5">
                    <select th:field="*{idCategorie}" class="form-select">
                        <option value="">-- Toutes les catégories --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.libelle}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-filter"></i> Filtrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tableau des résultats -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom du Plat</th>
                    <th>Catégorie</th>
                    <th>Prix de Vente</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="plat : ${platsList}">
                    <td th:text="${plat.id}"></td>
                    <td class="fw-bold" th:text="${plat.nom}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${plat.categoriePlats.libelle}"></span></td>
                    <td th:text="${#numbers.formatDecimal(plat.prixVente, 1, 'POINT', 2, 'COMMA') + ' Ar'}"></td>
                    <td class="text-center">
                        <a th:href="@{/recettes/plat/{id}(id=${plat.id})}" class="btn btn-sm btn-outline-primary" title="Voir Recette">
                            <i class="bi bi-journal-text"></i> Recette
                        </a>
                        <a th:href="@{/plats/delete/{id}(id=${plat.id})}" class="btn btn-sm btn-outline-danger" 
                           onclick="return confirm('Supprimer ce plat ?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(platsList)}">
                    <td colspan="5" class="text-center text-muted py-4">Aucun plat trouvé.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
