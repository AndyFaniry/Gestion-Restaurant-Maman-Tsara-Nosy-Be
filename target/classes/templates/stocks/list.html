<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>État des Stocks - Maman Tsara Nosy-Be</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>

<div class="app">

    <!-- Sidebar globale avec l'onglet 'stocks' actif -->
    <aside th:replace="~{fragments/layout :: sidebar('stocks')}"></aside>

    <div class="main">
        <!-- Topbar globale -->
        <div th:replace="~{fragments/layout :: topbar('État du Stock')}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h2>Mise à Jour / État du Stock</h2>
                    <div class="breadcrumb">Accueil / <span>Stocks</span></div>
                </div>
                <a th:href="@{/stocks/new}" class="btn btn-primary btn-sm">+ Ajuster le Stock</a>
            </div>

            <div class="card">
                <section class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ingrédient</th>
                                <th>Date Relevé</th>
                                <th>Quantité restante</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${stocksList}">
                                <td th:text="${s.id}">1</td>
                                <td th:text="${s.ingredient != null ? s.ingredient.nom : 'N/A'}">Ingrédient</td>
                                <td th:text="${#temporals.format(s.dateEtatStock, 'dd/MM/yyyy')}">30/07/2026</td>
                                <td th:text="${#numbers.formatDecimal(s.quantite, 1, 'WHITESPACE', 3, 'POINT')}">10.000</td>
                                <td class="actions">
                                    <a th:href="@{/stocks/edit/{id}(id=${s.id})}" class="btn btn-sm btn-secondary">Modifier</a>
                                    <a th:href="@{/stocks/delete/{id}(id=${s.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Effacer ce relevé de stock ?');">Supprimer</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(stocksList)}">
                                <td colspan="5" style="text-align: center; color: #888;">Aucun relevé de stock enregistré.</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/Design-template/Design/script.js}"></script>
</body>
</html>
