<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${client.id == null ? 'Ajouter un Client — Maman Tsara' : 'Modifier le Client — Maman Tsara'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

  <!-- Sidebar globale avec l'onglet 'clients' actif -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='clients')}"></aside>

  <!-- Conteneur principal -->
  <div class="main">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <!-- En-tête de la page -->
      <div class="page-header">
        <div>
          <h2 th:text="${client.id == null ? 'Ajouter un Client' : 'Modifier le Client'}">Client</h2>
          <div class="breadcrumb">
            Accueil / <a th:href="@{/clients}">Clients</a> / 
            <span th:text="${client.id == null ? 'Nouveau' : 'Édition'}">Formulaire</span>
          </div>
        </div>
        <a th:href="@{/clients}" class="btn btn-secondary">&larr; Retour à la liste</a>
      </div>

      <!-- Formulaire de saisie -->
      <form th:action="@{/clients/save}" th:object="${client}" method="post" id="clientForm">
        <input type="hidden" th:field="*{id}" />

        <div class="form-card mb-4">
          <h3 class="text-primary mb-3">Informations du Client</h3>

          <div class="form-grid">
            
            <div class="field-group">
              <label for="nom" class="field-label">Nom <span class="required">*</span></label>
              <input type="text" id="nom" th:field="*{nom}" required class="form-control" placeholder="Entrez le nom" />
            </div>

            <div class="field-group">
              <label for="prenom" class="field-label">Prénom</label>
              <input type="text" id="prenom" th:field="*{prenom}" class="form-control" placeholder="Entrez le prénom" />
            </div>

            <div class="field-group">
              <label for="contact" class="field-label">Contact <span class="required">*</span></label>
              <input type="text" id="contact" th:field="*{contact}" required class="form-control" placeholder="Téléphone ou email" />
            </div>

            <div class="field-group">
              <label for="typeClient" class="field-label">Type de Client <span class="required">*</span></label>
              <select id="typeClient" th:field="*{idTypeClient}" required class="form-control">
                <option value="">-- Sélectionner un type --</option>
                <option th:each="type : ${typesClient}" 
                        th:value="${type.id}" 
                        th:text="${type.libelle}">
                  Type
                </option>
              </select>
            </div>

          </div>
        </div>

        <!-- Barre d'actions -->
        <div class="toolbar d-flex justify-content-end gap-2 mb-4">
          <a th:href="@{/clients}" class="btn btn-secondary">Annuler</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Enregistrer
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
