<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mouvements Caisse</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1>Mouvements de Caisse</h1>
                <a th:href="@{/caisse/new}" class="btn btn-primary">Saisir un Mouvement</a>
            </header>
            <section class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Date</th><th>Type Mouvement</th><th>Montant (Ar)</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${mouvementsList}">
                            <td th:text="${m.id}">1</td>
                            <td th:text="${m.dateMouvement}">2026-07-30</td>
                            <td th:text="${m.typeMouvement != null ? m.typeMouvement.libelle : 'N/A'}">Type</td>
                            <td th:text="${#numbers.formatDecimal(m.montant, 1, 'POINT', 2, 'COMMA')}">45000.00</td>
                            <td class="actions">
                                <a th:href="@{/caisse/edit/{id}(id=${m.id})}" class="btn btn-warning">Modifier</a>
                                <a th:href="@{/caisse/delete/{id}(id=${m.id})}" class="btn btn-danger" onclick="return confirm('Supprimer ce mouvement ?');">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
