<<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${ 'Gestion caisse'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

    <!-- Sidebar globale avec l'onglet 'caisse' actif -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='caisse')}"></aside>

    <div class="main">
        <!-- Topbar globale avec titre dynamique -->
        <div th:replace="~{fragments/layout :: topbar(${mouvement.id == null ? 'Ajouter une Opération' : 'Modifier une Opération'})}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h2 th:text="${mouvement.id == null ? 'Ajouter une Opération' : 'Modifier une Opération'}">Opération de Caisse</h2>
                    <div class="breadcrumb">Accueil / Caisse / <span th:text="${mouvement.id == null ? 'Nouvelle opération' : 'Édition'}">Formulaire</span></div>
                </div>
                <a th:href="@{/caisse}" class="btn btn-secondary btn-sm">Retour aux mouvements</a>
            </div>

            <div class="card">
                <section class="form-container">
                    <form th:action="@{/caisse/save}" th:object="${mouvement}" method="post" class="custom-form">
                        <input type="hidden" th:field="*{id}" />

                        <div class="form-group">
                            <label for="dateMouvement">Date :</label>
                            <input type="date" id="dateMouvement" th:field="*{dateMouvement}" required class="form-control" />
                        </div>

                        <div class="form-group">
                            <label for="typeMouvement">Type d'opération :</label>
                            <select id="typeMouvement" th:field="*{typeMouvement.id}" class="form-control" required>
                                <option value="">-- Sélectionner --</option>
                                <option th:each="tm : ${typesMouvement}" 
                                        th:value="${tm.id}" 
                                        th:text="${tm.libelle}">Type</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="montant">Montant (Ar) :</label>
                            <input type="number" id="montant" step="0.01" min="0" th:field="*{montant}" placeholder="0.00" required class="form-control" />
                        </div>

                        <div class="form-actions" style="margin-top: 20px;">
                            <button type="submit" class="btn btn-primary">Enregistrer</button>
                            <a th:href="@{/caisse}" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>
</body>
</html>
