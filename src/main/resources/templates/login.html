<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#0f1729"/>
    <title>Connexion — Maman Tsara</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <link rel="apple-touch-icon" th:href="@{/img/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body.login-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(37, 99, 235, 0.18), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.15), transparent 45%),
                #0f1729;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            padding: clamp(1.5rem, 4vw, 2.25rem);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        }
        .login-brand { text-align: center; margin-bottom: 1.5rem; }
        .login-brand img {
            width: 48px; height: 48px;
            margin-bottom: 0.75rem;
            border-radius: 12px;
        }
        .login-brand h1 {
            font-size: clamp(1.25rem, 4vw, 1.5rem);
            margin: 0.25rem 0 0;
            color: #0f1729;
        }
        .login-brand p { color: #64748b; margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-brand">
        <img th:src="@{/img/favicon.svg}" alt="Maman Tsara"/>
        <div class="brand-name" style="font-weight:700;color:#2563eb;">Maman Tsara</div>
        <h1>Connexion</h1>
        <p>Gestion Restaurant — Nosy Be</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Identifiants incorrects. Vérifiez le nom d'utilisateur et le mot de passe.
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        Vous êtes déconnecté.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus/>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
</div>
</body>
</html>
