<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Restaurant App</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Define the topbar fragment accepting a title parameter -->
    <div th:fragment="topbar(title)">
        <h1 th:text="${title}">Default Title</h1>
    </div>
    
    <!-- Header & Navbar globale -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
                    <i class="fa-solid fa-utensils me-2"></i>Gestion Restaurant
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Fragment Navigation / Sidebar accessible indépendamment -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:fragment="sidebar(activeTab)">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'dashboard'} ? 'active'" th:href="@{/dashboard}">Tableau de Bord</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'ingredients'} ? 'active'" th:href="@{/ingredients}">Ingrédients</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'materielles'} ? 'active'" th:href="@{/materielles}">Matériels</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'plats'} ? 'active'" th:href="@{/plats}">Plats</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'commandes'} ? 'active'" th:href="@{/commandes}">Commandes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'fournisseurs'} ? 'active'" th:href="@{/fournisseurs}">Fournisseurs</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'clients'} ? 'active'" th:href="@{/clients}">Clients</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'personnels'} ? 'active'" th:href="@{/personnels}">Personnels</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activeTab == 'caisse'} ? 'active'" th:href="@{/caisse}">Caisse</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenu Principal Injecté -->
    <main class="container my-4 flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer Global -->
    <footer class="bg-dark text-light text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 ERP Restaurant — Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
