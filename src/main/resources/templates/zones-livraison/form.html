<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${zone.id == null ? 'Nouvelle Zone de Livraison' : 'Modifier Zone de Livraison'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='zones-livraison')}"></aside>

  <div class="main">
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h2 th:text="${zone.id == null ? 'Ajouter une Zone' : 'Modifier la Zone'}">Zone</h2>
          <div class="breadcrumb">
            Accueil / <a th:href="@{/zones-livraison}">Zones de Livraison</a> /
            <span th:text="${zone.id == null ? 'Nouveau' : 'Édition'}">Formulaire</span>
          </div>
        </div>
        <a th:href="@{/zones-livraison}" class="btn btn-secondary">&larr; Retour à la liste</a>
      </div>

      <form th:action="@{/zones-livraison/enregistrer}" th:object="${zone}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-card mb-4">
          <h3 class="form-section-title">Informations de la zone</h3>

          <div class="form-grid cols-1">
            <div class="field-group">
              <label class="field-label">Libellé <span class="required">*</span></label>
              <input type="text" th:field="*{libelle}" class="form-control"
                     th:classappend="${#fields.hasErrors('libelle')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{libelle}"></div>
            </div>
          </div>

          <div class="form-grid">
            <div class="field-group">
              <label class="field-label">Distance Min (km) <span class="required">*</span></label>
              <input type="number" step="0.001" th:field="*{min}" class="form-control"
                     th:classappend="${#fields.hasErrors('min')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{min}"></div>
            </div>
            <div class="field-group">
              <label class="field-label">Distance Max (km) <span class="required">*</span></label>
              <input type="number" step="0.001" th:field="*{max}" class="form-control"
                     th:classappend="${#fields.hasErrors('max')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{max}"></div>
            </div>
          </div>

          <div class="form-grid cols-1">
            <div class="field-group">
              <label class="field-label">Prix (Ar) <span class="required">*</span></label>
              <input type="number" step="0.01" th:field="*{prix}" class="form-control"
                     th:classappend="${#fields.hasErrors('prix')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{prix}"></div>
            </div>
          </div>

          <div class="form-footer">
            <a th:href="@{/zones-livraison}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>
</body>
</html>
