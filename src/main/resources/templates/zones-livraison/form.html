<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Zone de Livraison</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
   <h1 th:text="${zone.id == null ? 'Ajouter une Zone' : 'Modifier la Zone'}">Titre</h1>

    <form th:action="@{/zones-livraison/enregistrer}" th:object="${zone}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Libellé</label>
            <input type="text" th:field="*{libelle}" class="form-control" th:classappend="${#fields.hasErrors('libelle')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{libelle}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Distance Min</label>
                <input type="number" step="0.001" th:field="*{min}" class="form-control" th:classappend="${#fields.hasErrors('min')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{min}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Distance Max</label>
                <input type="number" step="0.001" th:field="*{max}" class="form-control" th:classappend="${#fields.hasErrors('max')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{max}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Prix</label>
            <input type="number" step="0.01" th:field="*{prix}" class="form-control" th:classappend="${#fields.hasErrors('prix')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{prix}"></div>
        </div>

        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a th:href="@{/zones-livraison}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
