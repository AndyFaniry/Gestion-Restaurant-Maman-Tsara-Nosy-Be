Zones de Livraison
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${ 'Zones de Livraison'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>
    <div class="app">
          <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='zones-livraison')}"></aside>

        <div class="main">
                    <!-- Topbar globale -->
        <div th:replace="~{fragments/layout :: topbar('zones-livraison')}"></div>

        <div class="content">
            <h2>Gestion des Zones de Livraison</h2>
        
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        
            <div class="d-flex justify-content-between mb-3">
                <form th:action="@{/zones-livraison}" method="get" th:object="${filter}" class="d-flex gap-2">
                    <input type="text" th:field="*{search}" class="form-control" placeholder="Rechercher par libellé...">
                    <button type="submit" class="btn btn-secondary">Filtrer</button>
                </form>
                <a th:href="@{/zones-livraison/creer}" class="btn btn-primary">Ajouter une Zone</a>
            </div>
        
            <table class="table table-striped border">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Libellé</th>
                        <th>Distance Min (km)</th>
                        <th>Distance Max (km)</th>
                        <th>Prix (Ariary)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="z : ${page.content}">
                        <td th:text="${z.id}">1</td>
                        <td th:text="${z.libelle}">Zone A</td>
                        <td th:text="${z.min}">0.000</td>
                        <td th:text="${z.max}">5.000</td>
                        <td th:text="${#numbers.formatDecimal(z.prix, 1, 'POINT', 2, 'COMMA')}">5.00</td>
                        <td class="d-flex gap-1">
                            <a th:href="@{/zones-livraison/modifier/{id}(id=${z.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <form th:action="@{/zones-livraison/supprimer/{id}(id=${z.id})}" method="post" onsubmit="return confirm('Confirmer la suppression ?');">
                                <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}">
                        <td colspan="6" class="text-center">Aucune zone de livraison trouvée.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        </div>
    </div>
    <div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>
</body>
</html>
