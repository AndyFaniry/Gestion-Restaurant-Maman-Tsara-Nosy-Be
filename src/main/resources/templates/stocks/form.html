<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Stock</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1 th:text="${stock.id == null ? 'Relevé de Stock' : 'Modifier Relevé de Stock'}"></h1>
            </header>
            <section class="form-container">
                <form th:action="@{/stocks/save}" th:object="${stock}" method="post" class="custom-form">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group">
                        <label>Ingrédient :</label>
                        <select th:field="*{ingredient}" class="form-control" required>
                            <option value="">-- Sélectionner un ingrédient --</option>
                            <option th:each="ing : ${ingredients}" th:value="${ing.id}" th:text="${ing.nom}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date Relevé :</label>
                        <input type="date" th:field="*{dateEtatStock}" required class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Quantité :</label>
                        <input type="number" step="0.001" th:field="*{quantite}" required class="form-control" />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                        <a th:href="@{/stocks}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
