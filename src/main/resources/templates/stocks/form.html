<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${stock.id == null ? 'Nouveau Relevé de Stock' : 'Modifier Relevé de Stock'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

  <!-- Sidebar globale -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='stocks')}"></aside>

  <!-- Conteneur principal -->
  <div class="main">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <div class="page-header">
        <div>
          <h2 th:text="${stock.id == null ? 'Saisir un Relevé de Stock' : 'Modifier le Relevé de Stock'}"></h2>
          <div class="breadcrumb">Accueil / <a th:href="@{/stocks}">Stocks</a> / <span>Formulaire</span></div>
        </div>
      </div>

      <div class="form-card">
        <form th:action="@{/stocks/save}" th:object="${stock}" method="post">
          <input type="hidden" th:field="*{id}" />

          <div class="form-grid">
            <div class="field-group">
              <label class="field-label">Ingrédient <span class="required">*</span></label>
              <!-- Ajustez th:field="*{ingredient.id}" si votre DTO utilise idIngredient -->
              <select th:field="*{ingredient}" class="form-control" required>
                <option value="">-- Sélectionner un ingrédient --</option>
                <option th:each="ing : ${ingredients}" 
                        th:value="${ing.id}" 
                        th:text="${ing.nom}">
                </option>
              </select>
            </div>
            
            <div class="field-group">
              <label class="field-label">Date Relevé <span class="required">*</span></label>
              <input type="date" th:field="*{dateEtatStock}" class="form-control" required />
            </div>
          </div>

          <div class="form-grid">
            <div class="field-group">
              <label class="field-label">Quantité <span class="required">*</span></label>
              <input type="number" step="0.001" th:field="*{quantite}" class="form-control" placeholder="0.000" required />
            </div>
          </div>

          <div class="toolbar">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/stocks}" class="btn btn-secondary">Annuler</a>
          </div>

        </form>
      </div>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
