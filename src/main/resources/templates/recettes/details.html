<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recette du Plat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <a th:href="@{/plats}" class="btn btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Retour aux plats</a>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h2 class="card-title text-primary" th:text="${plat.nom}"></h2>
            <p class="card-text text-muted">
                Catégorie : <span class="badge bg-info text-dark" th:text="${plat.categoriePlats.libelle}"></span> | 
                Prix de Vente : <strong th:text="${#numbers.formatDecimal(plat.prixVente, 1, 'POINT', 2, 'COMMA') + ' Ar'}"></strong>
            </p>
        </div>
    </div>

    <!-- Message de notification -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- Ingrédients composants le plat -->
        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-basket"></i> Ingrédients de la Recette</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Ingrédient</th>
                            <th>Quantité Requise</th>
                            <th>Unité</th>
                            <th class="text-center">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="recette : ${recettes}">
                            <td class="fw-bold" th:text="${recette.ingredient.nom}"></td>
                            <td th:text="${recette.quantiteRequise}"></td>
                            <td th:text="${recette.ingredient.unite.symbole}"></td>
                            <td class="text-center">
                                <form th:action="@{/recettes/supprimer/{id}(id=${recette.id})}" method="post" style="display:inline;">
                                    <input type="hidden" name="idPlat" th:value="${plat.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Retirer cet ingrédient ?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recettes)}">
                            <td colspan="4" class="text-center text-muted py-3">Aucun ingrédient associé à ce plat.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Formulaire rapide d'ajout d'ingrédient -->
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Ajouter un Ingrédient</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/recettes/ajouter}" method="post" th:object="${nouvelIngredient}">
                        <input type="hidden" th:field="*{idPlat}"/>
                        
                        <div class="mb-3">
                            <label class="form-label">Ingrédient</label>
                            <select th:field="*{idIngredient}" class="form-select" required>
                                <option value="">-- Choisir un Ingrédient --</option>
                                <option th:each="ing : ${ingredients}" th:value="${ing.id}" 
                                        th:text="${ing.nom + ' (' + ing.unite.symbole + ')'}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantité Requise</label>
                            <input type="number" step="0.001" th:field="*{quantiteRequise}" class="form-control" required placeholder="ex: 0.250">
                        </div>

                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg"></i> Ajouter à la recette</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
