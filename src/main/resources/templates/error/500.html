<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur Serveur (500)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 text-center" style="max-width: 500px;">
        <h1 class="display-4 text-danger">500</h1>
        <h3 class="mb-3">Erreur Interne du Serveur</h3>
        <p class="text-muted" th:text="${errorMessage}">Une erreur inattendue est survenue.</p>
        <div class="mt-4">
            <a href="/materielles" class="btn btn-primary">Retour à la liste</a>
        </div>
    </div>
</body>
</html>
