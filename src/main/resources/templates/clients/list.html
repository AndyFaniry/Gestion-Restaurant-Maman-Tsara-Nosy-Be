<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gestion des Clients — Maman Tsara</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="app">

  <!-- Sidebar réutilisée avec l'onglet active 'clients' -->
<div th:replace="~{fragments/layout :: topbar('Liste des Clients')}"></div>

  <div class="main">
    <!-- Topbar réutilisée -->
    <div th:replace="~{fragments/layout :: topbar('Liste des Clients')}"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h2>Clients</h2>
          <div class="breadcrumb">Accueil / <span>Clients</span></div>
        </div>
        <a th:href="@{/clients/new}" class="btn btn-primary btn-sm">+ Nouveau Client</a>
      </div>

      <div class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Prénom</th>
              <th>Contact</th>
              <th>Type</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="client : ${clientsList}">
              <td th:text="${client.id}">1</td>
              <td th:text="${client.nom}">Nom</td>
              <td th:text="${client.prenom}">Prénom</td>
              <td th:text="${client.contact}">Contact</td>
              <td th:text="${client.typeClientLibelle != null ? client.typeClientLibelle : '-'}"></td>
              <td>
                <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn btn-sm btn-secondary">Modifier</a>
                <a th:href="@{/clients/delete/{id}(id=${client.id})}" class="btn btn-sm btn-danger">Supprimer</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

</body>
</html>
