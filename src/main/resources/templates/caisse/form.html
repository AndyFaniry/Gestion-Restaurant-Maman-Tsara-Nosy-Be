<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${mouvement.id == null ? 'Nouvelle Opération de Caisse' : 'Modifier Opération de Caisse'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='caisse')}"></aside>

  <div class="main">
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h2 th:text="${mouvement.id == null ? 'Ajouter une Opération' : 'Modifier une Opération'}">Opération</h2>
          <div class="breadcrumb">
            Accueil / <a th:href="@{/caisse}">Caisse</a> /
            <span th:text="${mouvement.id == null ? 'Nouveau' : 'Édition'}">Formulaire</span>
          </div>
        </div>
        <a th:href="@{/caisse}" class="btn btn-secondary">&larr; Retour à la liste</a>
      </div>

      <form th:action="@{/caisse/save}" th:object="${mouvement}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-card mb-4">
          <h3 class="form-section-title">Détails du mouvement</h3>

          <div class="form-grid">
            <div class="field-group">
              <label class="field-label" for="dateMouvement">Date <span class="required">*</span></label>
              <input type="date" id="dateMouvement" th:field="*{dateMouvement}" required class="form-control"/>
            </div>
            <div class="field-group">
              <label class="field-label" for="typeMouvement">Type d'opération <span class="required">*</span></label>
              <select id="typeMouvement" th:field="*{idTypeMouvement}" class="form-control" required>
                <option value="">-- Sélectionner --</option>
                <option th:each="tm : ${typesMouvement}" th:value="${tm.id}" th:text="${tm.libelle}">Type</option>
              </select>
              <div class="text-danger" th:if="${#fields.hasErrors('idTypeMouvement')}" th:errors="*{idTypeMouvement}"></div>
            </div>
          </div>

          <div class="form-grid cols-1">
            <div class="field-group">
              <label class="field-label" for="montant">Montant (Ar) <span class="required">*</span></label>
              <input type="number" id="montant" step="0.01" min="0" th:field="*{montant}"
                     placeholder="0.00" required class="form-control"/>
              <div class="text-danger" th:if="${#fields.hasErrors('montant')}" th:errors="*{montant}"></div>
            </div>
          </div>

          <div class="form-footer">
            <a th:href="@{/caisse}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>
</body>
</html>
