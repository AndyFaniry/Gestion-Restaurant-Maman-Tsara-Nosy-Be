<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Caisse</title>
    <link rel="stylesheet" th:href="@{/Design-template/Design/style.css}">
</head>
<body>
    <div class="dashboard-container">
        <main class="content">
            <header class="header">
                <h1 th:text="${mouvement.id == null ? 'Ajouter une Opération' : 'Modifier une Opération'}"> Titre </h1>
            </header>
            <section class="form-container">
                <form th:action="@{/caisse/save}" th:object="${mouvement}" method="post" class="custom-form">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group">
                        <label>Date :</label>
                        <input type="date" th:field="*{dateMouvement}" required class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Type d'opération :</label>
                        <select th:field="*{typeMouvement}" class="form-control" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="tm : ${typesMouvement}" th:value="${tm.id}" th:text="${tm.libelle}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Montant (Ar) :</label>
                        <input type="number" step="0.01" th:field="*{montant}" required class="form-control" />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                        <a th:href="@{/caisse}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
