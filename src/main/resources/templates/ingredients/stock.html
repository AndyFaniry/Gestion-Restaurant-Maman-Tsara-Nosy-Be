<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>État Global des Stocks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>État des Stocks (Ingrédients)</h2>
        <a th:href="@{/ingredients}" class="btn btn-outline-secondary">&larr; Retour aux Ingrédients</a>
    </div>

    <!-- Cartes KPI -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card bg-success text-white shadow-sm">
                <div class="card-body">
                    <h5>Stock Normal / Correct</h5>
                    <h2 th:text="${nombreStockOk}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-warning text-dark shadow-sm">
                <div class="card-body">
                    <h5>Alerte / Stock Faible (&lt; 5)</h5>
                    <h2 th:text="${nombreAlerteStock}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Global Stock -->
    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Ingrédient</th>
                <th>Catégorie</th>
                <th>Quantité en Stock</th>
                <th>Unité</th>
                <th>Statut Stock</th>
                <th class="text-end">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${stockItems}">
                <td><strong th:text="${item.ingredient.nom}"></strong></td>
                <td th:text="${item.ingredient.categorieIngredients != null ? item.ingredient.categorieIngredients.libelle : '-'}"></td>
                <td th:text="${item.quantiteActuelle}"></td>
                <td th:text="${item.ingredient.unite != null ? item.ingredient.unite.symbole : ''}"></td>
                <td>
                    <span th:if="${item.quantiteActuelle &lt; 5}" class="badge bg-danger">Alerte Faible</span>
                    <span th:if="${item.quantiteActuelle &gt;= 5}" class="badge bg-success">En Stock</span>
                </td>
                <td class="text-end">
                    <a th:href="@{/ingredients/{id}/detail(id=${item.ingredient.id})}" class="btn btn-sm btn-primary">Mouvement</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(stockItems)}">
                <td colspan="6" class="text-center text-muted py-4">Aucun stock disponible.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
