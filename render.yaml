# Blueprint Render — Web Docker + Neon (Postgres externe)
# Docs : https://render.com/docs/blueprint-spec
#
# Au premier déploiement, renseigner dans le dashboard :
#   DATABASE_URL          = connection string Neon (postgresql://...?...sslmode=require)
#   APP_ADMIN_PASSWORD    = mot de passe admin applicatif

services:
  - type: web
    name: restaurant-maman-tsara
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m"
      - key: HIKARI_MAX_POOL_SIZE
        value: "5"
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
