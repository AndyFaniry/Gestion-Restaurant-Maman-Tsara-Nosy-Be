services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: "jdbc:postgresql://db:5432/restaurant?user=${POSTGRES_USER:-dev1}&password=${POSTGRES_PASSWORD:-dev}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: restaurant-db
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: ${POSTGRES_USER:-dev1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev1} -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # phpMyAdmin ne gère que MySQL — Adminer est l'équivalent pour PostgreSQL
  adminer:
    image: adminer:4
    container_name: restaurant-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
